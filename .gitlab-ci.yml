stages:
    - test
    - deploy

variables:
    PIP_EXTRA_INDEX_URL: "${CI_API_V4_URL}/groups/paketzentrum/-/packages/pypi/simple"
    UV_EXTRA_INDEX_URL: "$PIP_EXTRA_INDEX_URL"
    UV_PUBLISH_USERNAME: "gitlab-ci-token"
    UV_PUBLISH_PASSWORD: "${CI_JOB_TOKEN}"
    UV_PUBLISH_URL: "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/pypi"
    UV_PUBLISH_CHECK_URL: "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/-/packages/pypi/simple"

default:
    image: ubuntu:latest
    tags:
        - docker
    before_script:
        - apt-get -y update
        - apt-get -y install curl
        - curl -LsSf https://astral.sh/uv/install.sh | sh
        - source ~/.local/bin/env
        - echo "machine ${CI_SERVER_HOST}" > ~/.netrc
        - echo "login gitlab-ci-token" >> ~/.netrc
        - echo "password ${CI_JOB_TOKEN}" >> ~/.netrc
        - echo "Creating virtual environment with development dependencies."
        - uv sync
        - source .venv/bin/activate

test:
    stage: test
    script:
        - tox
    coverage: '/(?i)total.*? (100(?:\.0+)?\%|[1-9]?\d(?:\.\d+)?\%)$/'
    artifacts:
        reports:
            junit: reports/junit.xml
            coverage_report:
                coverage_format: cobertura
                path: reports/coverage.xml
        paths:
            - reports/coverage
    rules:
        - if: '$CI_PIPELINE_SOURCE == "push"'
    tags:
        - docker

# Package is deployed to the registry everytime a tag is created.
# This works on any branch, because filtering for master is impossible, see https://gitlab.com/gitlab-org/gitlab-runner/-/issues/26548
publish:
    stage: deploy
    script:
        - uv build
        - uv publish
    rules:
        - if: $CI_COMMIT_TAG
          allow_failure: true
