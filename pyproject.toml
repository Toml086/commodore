[project]
name = "commodore"
version = "1.0.0"
description = "commodore project"
readme = "README.md"
requires-python = ">=3.12"
authors = [
    { name = "Tom-Luca Tettenborn", email = "tom-luca.tettenborn@imms.de" },
]
dependencies = [
    # TODO Add dependencies here
]

[project.optional-dependencies]
type-stubs = [
    # TODO Add type stubs for dependencies here
    "pytest-stub",
]

[project.urls]
Homepage = "https://gitlabe.imms.de/mygl/paketzentrum/commodore"

# Build System
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/commodore"]

# uv
[tool.uv]
required-version = ">=0.9.10"

# Dependency groups
[dependency-groups]
dev = [
    "commodore[type-stubs]",
    # tox
    "tox>=4.64.8",
    "tox-uv>=1.36.1",
    # Pytest
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    # Static code checkers
    "mypy>=2.4.0",
    "ruff>=0.16.10",
]

# Coverage Configuration
[tool.coverage.run]
branch = true
parallel = true
relative_files = true

[tool.coverage.paths]
source = [
    "src/",
    ".tox/*/lib/*/site-packages/",
    ".tox/*/lib/site-packages/",
    "**/hatch/**/lib/*/site-packages/",
]

[tool.coverage.report]
fail_under = 1
exclude_also = [
    "raise RuntimeError",
    "@(typing\\.)?overload",
    "Protocol",
]

[tool.coverage.xml]
output = "reports/coverage.xml"

[tool.coverage.html]
directory = "reports/coverage"

# Mypy Configuration
[tool.mypy]
python_version = "3.12"
mypy_path = ["./src", "./stubs"]
disallow_any_unimported = true
disallow_any_expr = true
disallow_any_decorated = true
disallow_any_explicit = true
disallow_any_generics = true
disallow_subclassing_any = true
disallow_untyped_calls = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_return_any = true
warn_unreachable = true
implicit_reexport = false
strict_equality = true

# Ruff Configuration
[tool.ruff]
line-length = 150

[tool.ruff.lint]
pydocstyle.convention = "google"
extend-select = ["W", "C90", "D", "I", "ERA", "PERF", "RUF"]
# Missing docstring warnings are partially disabled.
# TODO You can remove the next line for more aggressive docstring rules.
extend-ignore = ["D100", "D101", "D102", "D103", "D104", "D105", "D106", "D107", "D202"]

[tool.ruff.format]
quote-style = "single"
